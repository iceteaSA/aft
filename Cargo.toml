[workspace]
resolver = "2"
members = ["crates/aft", "crates/aft-tokenizer"]

# MSRV contract: the locked oxc 0.126 dependency family requires rustc 1.92,
# so `cargo check --locked` on an older toolchain dies with a transitive
# dependency error instead of an AFT-owned diagnostic. Declaring it here makes
# cargo surface a clear "requires rustc 1.92" error and lets CI pin the floor.
# We deliberately do NOT add a rust-toolchain.toml pin: contributors on newer
# stable must not be forced down to the floor.
[workspace.package]
rust-version = "1.92"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Emit line tables + symbol names into a SEPARATE artifact (the dSYM bundle on
# macOS, a .dwp on Linux) instead of the shipped binary. `strip = true` above
# still strips the shipped binary, so its size does not regress; the debug info
# lands in the sibling dSYM/dwp that release.yml packages and uploads. This is
# what lets `sample`/`atos` symbolicate a deployed release binary by name
# instead of returning nameless offsets (v0.50.x, v0.51.0 wedge on 2026-08-17).
# line-tables-only is cheap (no full debug=2); it only adds the line table +
# symbol names needed for stack symbolication.
debug = "line-tables-only"
split-debuginfo = "packed"

# Local staging builds (dev binaries for the daemon/NDJSON caches). No LTO +
# default parallel codegen: a dev-bounce binary is rebuilt many times a day,
# and LTO buys ~10-15% runtime at a link cost that dominates every iteration
# (dist-grade linking on dev builds was the wrong trade; grok-build measured
# the same split at 2.2x build time). GitHub releases keep [profile.release]
# (fat LTO, stripped) — maximum optimization for shipped binaries.
[profile.stage]
inherits = "release"
lto = false
codegen-units = 16
# Line tables + symbol names so `sample`/Instruments on a staged dev module
# resolves real function names (release inherits strip=true, which left a
# 91%-CPU thread anonymous during live diagnosis). Costs a few MB of binary
# size on local staging builds only; GitHub releases stay stripped.
strip = false
debug = 1
# "unwind" instead of "abort" so catch_unwind works — required because
# the ort crate panics (instead of returning Err) when dlopen fails on
# an incompatible libonnxruntime.so. With "abort", that panic kills the
# entire aft process and takes down all tools. With "unwind", the
# catch_unwind in configure.rs catches it and degrades gracefully.
panic = "unwind"

# Fork-local: build against the subconscious Phase-1 pin (86953f3) so the
# decoder accepts daemon-origin envelope flag bit 6 before the daemon stamps
# it, and so ManifestProvenance is available to declare. These versions are
# not published to crates.io yet; drop this patch once they are.
[patch.crates-io]
subc-protocol = { path = "/home/icetea/worktrees/subc-pin-5a9d02aa/crates/subc-protocol" }
subc-transport = { path = "/home/icetea/worktrees/subc-pin-5a9d02aa/crates/subc-transport" }
subc-client-rs = { path = "/home/icetea/worktrees/subc-pin-5a9d02aa/crates/subc-client-rs" }
subc-control = { path = "/home/icetea/worktrees/subc-pin-5a9d02aa/crates/subc-control" }
